# Build Windows + Linux desktop clients and publish a GitHub Release so the
# in-app updater (electron-updater) can find platform-specific artifacts
# (latest.yml for Windows, latest-linux.yml for AppImage).
name: release-client

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Client version to release (must match client/package.json)'
        required: true
        default: '1.8.37'
      platforms:
        description: 'Which packages to build'
        type: choice
        options:
          - both
          - windows
          - linux
        default: both
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    if: ${{ github.event_name == 'push' || inputs.platforms == 'both' || inputs.platforms == 'windows' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Skip package install scripts: better-sqlite3 has no Node prebuild for
      # every Node version and would try (and fail) a Visual Studio rebuild.
      # electron-builder install-app-deps rebuilds natives for Electron's ABI
      # (which does have prebuilds).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild natives for Electron
        run: npx electron-builder install-app-deps

      - name: Sync embedded server
        run: npm run sync-server

      - name: Build + publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish always

  release-linux:
    if: ${{ github.event_name == 'push' || inputs.platforms == 'both' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild natives for Electron
        run: npx electron-builder install-app-deps

      - name: Sync embedded server
        run: npm run sync-server

      # AppImage + .deb — electron-updater consumes latest-linux.yml from the
      # same GitHub Release as the Windows latest.yml.
      - name: Build + publish Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage deb --x64 --publish always
