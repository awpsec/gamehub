# Build the Windows installer and publish a GitHub Release so the
# in-app updater (electron-updater) can find it via latest.yml.
name: release-client

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Client version to release (must match client/package.json)'
        required: true
        default: '1.8.4'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Skip package install scripts: better-sqlite3 has no Node prebuild for
      # every Node version and would try (and fail) a Visual Studio rebuild.
      # electron-builder install-app-deps rebuilds natives for Electron's ABI
      # (which does have prebuilds).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild natives for Electron
        run: npx electron-builder install-app-deps

      - name: Sync embedded server
        run: npm run sync-server

      - name: Build + publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish always
