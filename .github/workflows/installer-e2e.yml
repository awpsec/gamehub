# Real installers on a real Windows machine — the things unit tests can't prove.
#   scene-release: RUNE-style multi-part RAR → ISO → Inno setup + crack folder,
#                  through Gamehub's unpack / silent-install / crack pipeline
#   app-update:    Gamehub's own installer — single instance, and updating over
#                  a running Gamehub
name: installer-e2e

on:
  workflow_dispatch:
  push:
    paths:
      - 'client/lib/**'
      - 'client/main.js'
      - 'client/build/**'
      - 'client/scripts/vendor-7zip.js'
      - 'client/test-e2e/**'
      - 'client/package.json'
      - '.github/workflows/installer-e2e.yml'

jobs:
  scene-release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle 7-Zip (as the release build does)
        run: node scripts/vendor-7zip.js --require

      - name: Install Inno Setup + WinRAR (to BUILD the test release)
        run: |
          # Chocolatey's feed is flaky — retry. Inno Setup is usually preinstalled.
          foreach ($pkg in 'innosetup', 'winrar') {
            for ($i = 1; $i -le 4; $i++) {
              choco install $pkg -y --no-progress
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds (15 * $i)
            }
          }
          if (-not (Test-Path 'C:\Program Files\WinRAR\Rar.exe')) { throw 'WinRAR missing' }
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { throw 'Inno Setup missing' }

      - name: Build a RUNE-style release
        run: ./test-e2e/make-scene-release.ps1 -Out "$env:RUNNER_TEMP\release"

      - name: Install it through Gamehub's pipeline
        run: node test-e2e/scene-release.e2e.js "$env:RUNNER_TEMP\release" "$env:RUNNER_TEMP\e2e"

  linux-unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bundle 7-Zip (same download + hash check as the release build)
        run: ./scripts/fetch-7zip-linux.sh
        env:
          SEVENZIP_TARBALL: ''
          SEVENZIP_SHA256: ''
      - name: Build a RUNE-style release
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rar genisoimage
          ./test-e2e/make-scene-release.sh "$RUNNER_TEMP/release"
      - name: Unpack it through Gamehub's pipeline
        run: node test-e2e/scene-release.e2e.js "$RUNNER_TEMP/release" "$RUNNER_TEMP/e2e"

  app-update:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: client
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx electron-builder install-app-deps
      - run: npm run sync-server
      - run: node scripts/vendor-7zip.js --require
      - name: Build the Windows installer (not published)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Install, single-instance, update over a running Gamehub
        run: |
          $setup = (Get-ChildItem dist -Filter 'Gamehub-Setup-*.exe' | Select-Object -First 1).FullName
          ./test-e2e/app-update.ps1 -Setup $setup
